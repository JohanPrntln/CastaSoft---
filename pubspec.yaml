name: castasoft
description: "Sistema de gestión para criaderos de gallos."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0' # 🔥 Más compatible

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.8.0
  flutter_localizations:
    sdk: flutter
  
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  
  provider: ^6.1.0
  uuid: ^4.0.0
  intl: ^0.20.2
  
  image_picker: ^1.1.2
  path: ^1.8.2
  path_provider: ^2.1.2
  
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  
  url_launcher: ^6.3.2
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo_texto_castasoft_sf.png
    - assets/pluma_login-removebg-preview.png
    - assets/logo_login_final.jpg
    - assets/icono_app.jpg 
    - assets/plantilla_pedigree.png
    - assets/gallo_transparente.png

# Configuración del icono
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
  image_path: "assets/gallo_transparente.png"
  adaptive_icon_background: "#000000" 
  adaptive_icon_foreground: "assets/gallo_transparente.png"