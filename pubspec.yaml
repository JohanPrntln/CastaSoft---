name: castasoft
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Iconos estilo iOS
  cupertino_icons: ^1.0.8
  
  # Diseño corporativo
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.8.0
  
  # Localización
  flutter_localizations:
    sdk: flutter
  
  # Base de datos SQLite
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  
  # Gestión de estado
  provider: ^6.1.0
  
  # Utilidades
  uuid: ^4.0.0
  
  # Multimedia
  image_picker: ^1.1.2
  
  # Archivos y rutas
  path: ^1.8.2
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Configuración de assets
  assets:
    - assets/images/
    - assets/logo_texto_castasoft_sf.png
    - assets/pluma_login-removebg-preview.png
    - assets/logo_login_final.jpg
    # Asegúrate de que este archivo exista si lo vas a usar de icono:
    - assets/icono_app.jpg 

# Configuración de los ICONOS DE LA APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # ⚠️ IMPORTANTE: Asegúrate de que esta imagen exista en tu carpeta assets.
  # Si quieres usar la misma del login, cambia esto a: "assets/logo_login_final.jpg"
  image_path: "assets/icono_app.jpg" 
  min_sdk_android: 21